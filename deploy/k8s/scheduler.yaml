apiVersion: apps/v1
kind: Deployment
metadata:
  name: orbit-scheduler
  namespace: orbit
spec:
  # 2 replicas on purpose, not 1: this is the actual point of running the
  # scheduler under a ReplicaSet at all. internal/election's etcd campaign
  # is what guarantees only ONE of these two Pods ever ticks at a time --
  # the other sits as a hot standby, ready to take over the instant the
  # leader's lease lapses (graceful Resign on SIGTERM, or TTL expiry on a
  # hard kill). Kubernetes' own restart-on-crash guarantee is a DIFFERENT,
  # weaker property than this: it would eventually replace a dead pod, but
  # only after a fresh container finishes its whole startup+campaign path.
  # A live standby that's already past that path is what makes failover
  # sub-second instead of "however long a cold restart takes."
  replicas: 2
  selector:
    matchLabels:
      app: orbit-scheduler
  template:
    metadata:
      labels:
        app: orbit-scheduler
    spec:
      containers:
        - name: scheduler
          image: orbit-scheduler:dev
          imagePullPolicy: IfNotPresent
          env:
            # The Downward API surfaces the Pod's own name into an env var
            # -- no other way for a container to know what Kubernetes
            # named it. Used as ORBIT_NODE_ID so etcd's election log and
            # this project's own log lines both show which real Pod is
            # leader at any moment, not an opaque random ID.
            - name: ORBIT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: orbit-config
            - secretRef:
                name: orbit-db-credentials
          ports:
            - name: metrics
              containerPort: 9101
          # No dedicated /healthz exists yet (a real gap, not hidden) --
          # these reuse the /metrics endpoint that's already there. It's a
          # valid liveness signal (proves the HTTP server goroutine is
          # alive) but NOT a readiness signal for the things that actually
          # matter (etcd/Postgres/Kafka reachability) -- a scheduler could
          # report itself "ready" while unable to reach any of its
          # dependencies. Documented in deploy/k8s/README.md as a known
          # gap, not silently glossed over.
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orbit-scheduler
  namespace: orbit
  labels:
    app: orbit-scheduler
spec:
  selector:
    app: orbit-scheduler
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
# minAvailable: 1, not 2 -- during a voluntary disruption (a node drain,
# a cluster upgrade) this guarantees Kubernetes never evicts BOTH
# scheduler Pods at once. It doesn't need to guarantee 2 stay up: only one
# is ever the active leader anyway, so 1 surviving Pod means zero
# scheduling gap, just a temporarily absent standby.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orbit-scheduler
  namespace: orbit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: orbit-scheduler
