# Same trivial dev credential already committed in plaintext in
# deploy/compose/docker-compose.yml (scheduler/scheduler) -- not a new
# leak, just the k8s-native place to put it. `stringData` here is
# committed to git for local-cluster convenience, same reasoning as the
# compose file: this is a throwaway local dev credential, not a real one.
# In a real deployment this Secret would be created by a secrets manager
# (Vault, AWS Secrets Manager via External Secrets Operator, Sealed
# Secrets) rather than committed as plain YAML -- that's the actual
# production pattern this file deliberately doesn't pretend to be.
apiVersion: v1
kind: Secret
metadata:
  name: orbit-db-credentials
  namespace: orbit
type: Opaque
stringData:
  ORBIT_DATABASE_URL: "postgres://scheduler:scheduler@host.docker.internal:5433/scheduler?sslmode=disable"
