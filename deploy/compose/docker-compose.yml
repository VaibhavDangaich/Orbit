services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      # Host 5433, not 5432: a machine-local Postgres install may already
      # own 5432 on localhost, and Docker's proxy can silently lose that
      # race depending on which process bound the loopback address first.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://0.0.0.0:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - etcddata:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 10

  kafka:
    # Official Apache Kafka image (not bitnami/kafka -- Broadcom moved
    # most bitnami image tags behind a paid subscription in 2025, so the
    # tag this project originally targeted no longer pulls for free).
    image: apache/kafka:3.8.0
    environment:
      # KRaft mode: Kafka's own Raft-based metadata quorum, replacing
      # Zookeeper since Kafka 3.3+ (mandatory as of 4.0) -- one less
      # service to run for a single-node setup.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two client-facing listeners, not one -- the classic "why can't my
      # client reach Kafka in Docker" gotcha. Kafka's protocol is two-hop:
      # a client dials any broker, then gets back cluster metadata telling
      # it the ADVERTISED address to use for the actual request -- and
      # that address has to already be resolvable from wherever the client
      # is. A host process and a k8s pod are two different "wheres": the
      # host resolves "localhost" to itself, a kind pod resolves it to the
      # pod's own loopback, not the host. One fixed advertised address
      # can't satisfy both -- hence PLAINTEXT for host processes (TUI,
      # tests, `go run`) and K8S for pods reaching back out via
      # host.docker.internal, on two different ports.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,K8S://:9094
      # Host 19092, not 9092: a machine-local Kafka install is already
      # bound to 9092/9093 on localhost -- the exact same class of
      # collision as the Postgres 5432 issue earlier, caught the same way
      # (checking `lsof` before assuming the default port is free).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092,K8S://host.docker.internal:19094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,K8S:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single combined broker+controller process, "localhost" here
      # resolves inside the container's own network namespace (unlike our
      # multi-container postgres/etcd services), so this correctly points
      # the controller quorum at itself.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A fixed, valid-format cluster ID for this single-node dev
      # instance -- the standard literal used in Apache Kafka's own KRaft
      # quickstart docs, not something that needs to be cryptographically
      # generated for local dev.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "19092:9092"
      - "19094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380, not the Redis default 6379: this machine already has a
      # native Redis listening on 6379 (`lsof -nP -iTCP:6379 -sTCP:LISTEN`
      # showed a redis-server process bound there before this service was
      # added) -- the exact same class of collision as Postgres on 5432
      # and Kafka on 9092/9093 above, caught the same way.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (Mac/Windows)
      # -- this line is what makes the same compose file also work on
      # Linux Docker Engine, where it isn't defined by default.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      # Host 3001, not Grafana's default 3000: a native process on this
      # machine already owns 3000 (`lsof -nP -iTCP:3000 -sTCP:LISTEN`) --
      # the same class of collision as Postgres/Kafka/Redis above.
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  jaeger:
    # All-in-one: OTLP receiver, in-memory storage, and the query UI in one
    # container -- fine for local dev, not how you'd run this in
    # production (that needs a real trace storage backend).
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

  # ---------------------------------------------------------------------
  # Schema + application. Everything above this line is infrastructure.
  # ---------------------------------------------------------------------

  # Applies migrations/*.up.sql and exits. NOT in the `app` profile -- it
  # runs on a plain `docker compose up -d` too, because every path into
  # this project needs the schema to exist: containerised app, host `go
  # run`, kind pods, and `go test ./...` (store_test.go's fixture
  # TRUNCATEs tables it assumes are already there). Before this service
  # the README told you to pipe two .sql files through `docker exec psql`
  # by hand, and nothing enforced that you had.
  #
  # golang-migrate rather than `psql -f`, because the migration files are
  # already named for it (0001_init.up.sql) and it records applied
  # versions in a schema_migrations table -- which is what makes `up`
  # safe to re-run on every boot. Plain psql would re-execute CREATE
  # TABLE and fail on the second start; these files are deliberately not
  # written with IF NOT EXISTS, since versioned migrations aren't
  # supposed to be.
  #
  # Upgrading a database created BEFORE this service existed (tables
  # present, no schema_migrations row) needs a one-time baseline, or
  # migrate will try to apply 0001 onto tables that already exist:
  #   docker compose -f deploy/compose/docker-compose.yml run --rm migrate \
  #     -path=/migrations \
  #     -database=postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable \
  #     force 2
  # That only writes the version marker -- it touches no data. The flags
  # have to be repeated: `compose run` replaces the service's whole
  # command, so `run --rm migrate force 2` would drop -database with it.
  migrate:
    image: migrate/migrate:v4.18.1
    volumes:
      - ../../migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy

  # scheduler and worker sit behind the `app` profile, so they start only
  # with `--profile app`. A bare `docker compose up -d` keeps its existing
  # meaning -- infrastructure only -- which is what the host `go run`
  # workflow and the kind manifests in deploy/k8s both already assume.
  # Starting them by default would put a second scheduler in the election
  # the moment anyone ran `go run ./cmd/scheduler` next to it.
  #
  # Note the endpoints below are SERVICE NAMES on the compose network
  # (postgres:5432, kafka:9092, redis:6379), not the host-mapped ports
  # used everywhere else in this file (5433, 19092, 6380). A container
  # reaching "localhost:5433" reaches itself, not the host -- the same
  # two-hop Kafka addressing problem documented on the kafka service, seen
  # from inside the network this time. Kafka's PLAINTEXT listener
  # advertises localhost:19092 for host clients, but a compose-internal
  # client connects to kafka:9092 directly and never consults that
  # advertised address for the initial dial.
  #
  # No `ports:` on either service on purpose: that's what allows
  # `--scale scheduler=2 --scale worker=3`, since a fixed host port
  # mapping can't be shared by replicas. Prometheus reaches their
  # /metrics over the compose network instead (see prometheus.yml), and
  # ORBIT_NODE_ID/ORBIT_WORKER_ID are left unset so each replica falls
  # back to hostname-pid, which is already unique per container.
  scheduler:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/scheduler.Dockerfile
    environment:
      ORBIT_DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      ORBIT_ETCD_ENDPOINTS: etcd:2379
      ORBIT_KAFKA_BROKERS: kafka:9092
      ORBIT_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      migrate:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started
    restart: unless-stopped

  worker:
    profiles: [app]
    build:
      context: ../..
      dockerfile: deploy/docker/worker.Dockerfile
    environment:
      ORBIT_DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/scheduler?sslmode=disable
      ORBIT_KAFKA_BROKERS: kafka:9092
      ORBIT_REDIS_ADDR: redis:6379
      ORBIT_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    # restart: unless-stopped is what makes the crash-recovery demo
    # honest -- a killed worker comes back and re-claims, rather than
    # staying dead and making lease expiry look like the only recovery
    # path. The scheduler gets it for the same reason on failover.
    restart: unless-stopped

volumes:
  pgdata:
  etcddata:
  kafkadata:
  redisdata:
  promdata:
  grafanadata:
