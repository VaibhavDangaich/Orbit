services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      # Host 5433, not 5432: a machine-local Postgres install may already
      # own 5432 on localhost, and Docker's proxy can silently lose that
      # race depending on which process bound the loopback address first.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
