services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports:
      # Host 5433, not 5432: a machine-local Postgres install may already
      # own 5432 on localhost, and Docker's proxy can silently lose that
      # race depending on which process bound the loopback address first.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://0.0.0.0:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://0.0.0.0:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - etcddata:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 2s
      timeout: 3s
      retries: 10

  kafka:
    # Official Apache Kafka image (not bitnami/kafka -- Broadcom moved
    # most bitnami image tags behind a paid subscription in 2025, so the
    # tag this project originally targeted no longer pulls for free).
    image: apache/kafka:3.8.0
    environment:
      # KRaft mode: Kafka's own Raft-based metadata quorum, replacing
      # Zookeeper since Kafka 3.3+ (mandatory as of 4.0) -- one less
      # service to run for a single-node setup.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Host 19092, not 9092: a machine-local Kafka install is already
      # bound to 9092/9093 on localhost -- the exact same class of
      # collision as the Postgres 5432 issue earlier, caught the same way
      # (checking `lsof` before assuming the default port is free).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single combined broker+controller process, "localhost" here
      # resolves inside the container's own network namespace (unlike our
      # multi-container postgres/etcd services), so this correctly points
      # the controller quorum at itself.
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A fixed, valid-format cluster ID for this single-node dev
      # instance -- the standard literal used in Apache Kafka's own KRaft
      # quickstart docs, not something that needs to be cryptographically
      # generated for local dev.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "19092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      # Host 6380, not the Redis default 6379: this machine already has a
      # native Redis listening on 6379 (`lsof -nP -iTCP:6379 -sTCP:LISTEN`
      # showed a redis-server process bound there before this service was
      # added) -- the exact same class of collision as Postgres on 5432
      # and Kafka on 9092/9093 above, caught the same way.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    extra_hosts:
      # host.docker.internal is automatic on Docker Desktop (Mac/Windows)
      # -- this line is what makes the same compose file also work on
      # Linux Docker Engine, where it isn't defined by default.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy"]
      interval: 3s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      # Host 3001, not Grafana's default 3000: a native process on this
      # machine already owns 3000 (`lsof -nP -iTCP:3000 -sTCP:LISTEN`) --
      # the same class of collision as Postgres/Kafka/Redis above.
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafanadata:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  etcddata:
  kafkadata:
  redisdata:
  promdata:
  grafanadata:
